# fly.toml app configuration file generated for live-audio-bridge-solitary-resonance-9979 on 2026-02-10T23:12:16-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'live-audio-bridge-solitary-resonance-9979'
primary_region = 'dfw'

[build]

[env]
  DATA_DIR = '/data'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
